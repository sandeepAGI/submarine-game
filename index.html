<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submarine Sample Collection Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background-color: #001a2e;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        /* HUD Styles */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: #00ff88;
            font-size: 14px;
        }

        .hud-panel {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #00ff88;
            padding: 10px;
            pointer-events: auto;
        }

        #top-left {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        #top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
        }

        .meter {
            margin: 5px 0;
        }

        .meter-bar {
            width: 200px;
            height: 20px;
            background: #003366;
            border: 1px solid #00ff88;
            position: relative;
            margin-top: 3px;
        }

        .meter-fill {
            height: 100%;
            background: #00ff88;
            transition: width 0.3s;
        }

        .meter-fill.low {
            background: #ff4444;
        }

        .quest-list {
            margin-top: 10px;
        }

        .quest-item {
            margin: 5px 0;
            padding: 5px;
            background: rgba(0, 50, 100, 0.5);
            border-left: 3px solid #00ff88;
        }

        /* UI Modal */
        #ui-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            border: 3px solid #00ff88;
            padding: 30px;
            min-width: 500px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
            display: none;
        }

        #ui-modal.active {
            display: block;
        }

        #ui-modal h2 {
            color: #00ff88;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        .ui-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #00ff88;
        }

        .ui-section h3 {
            color: #00ff88;
            margin-bottom: 10px;
        }

        .button {
            background: #003366;
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .button:hover {
            background: #00ff88;
            color: #001a2e;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-item, .quest-detail {
            padding: 10px;
            margin: 5px 0;
            background: rgba(0, 50, 100, 0.3);
            border-left: 3px solid #00ff88;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .inventory-item {
            padding: 10px;
            background: rgba(0, 50, 100, 0.5);
            border: 1px solid #00ff88;
            text-align: center;
        }

        #message-log {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            pointer-events: none;
        }

        .message {
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00ff88;
            padding: 10px;
            margin: 5px 0;
            text-align: center;
            animation: fadeIn 0.3s, fadeOut 0.3s 2.7s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div id="top-left" class="hud-panel">
            <div class="meter">
                <div>OXYGEN: <span id="oxygen-value">100</span>%</div>
                <div class="meter-bar">
                    <div class="meter-fill" id="oxygen-bar" style="width: 100%"></div>
                </div>
            </div>
            <div class="meter">
                <div>DEPTH: <span id="depth-value">0</span>m</div>
            </div>
            <div class="meter">
                <div>CREDITS: <span id="credits-value">0</span></div>
            </div>
        </div>

        <div id="top-right" class="hud-panel">
            <div><strong>ACTIVE QUEST</strong></div>
            <div class="quest-list" id="quest-display">
                <div class="quest-item">No active quest. Press [E] at surface.</div>
            </div>
            <div style="margin-top: 10px;">
                <div>INVENTORY: <span id="inventory-count">0</span>/<span id="inventory-max">5</span></div>
            </div>
        </div>

        <div id="message-log"></div>
    </div>

    <!-- Research Ship UI Modal -->
    <div id="ui-modal">
        <h2>RESEARCH SHIP - WELCOME ABOARD</h2>

        <div class="ui-section" id="quest-section">
            <h3>QUEST TERMINAL</h3>
            <div id="active-quest-display"></div>
            <div id="quest-actions"></div>
        </div>

        <div class="ui-section" id="upgrade-section">
            <h3>UPGRADE STATION</h3>
            <div id="upgrade-list"></div>
        </div>

        <div class="ui-section" id="repair-section">
            <h3>REPAIR STATION</h3>
            <div id="repair-display"></div>
        </div>

        <button class="button" onclick="window.game.closeUI()">CLOSE [ESC]</button>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
